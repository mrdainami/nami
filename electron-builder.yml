appId: ai.dainami.nami
productName: Nami

# Nami is Dainami's, and without this line electron-builder said otherwise. With
# no `copyright` it builds NSHumanReadableCopyright out of `author`, so every
# shipped bundle carried "Copyright © 2026 Calvin Hia" in its Info.plist and in
# the About panel, a string nobody had written anywhere. The year is the
# release's, so it is written out rather than taken from the build machine's
# clock. main.js sets the same string on the About panel for dev runs.
copyright: Copyright © 2026 Dainami AI
directories:
  output: release
  buildResources: build

# Releases go to a DIFFERENT repo from the source, and that is the point.
#
# Installers and update metadata go to this repo's own releases. An app that
# updates itself has to read its feed from somewhere public, and this repo is
# public, so no token ships inside a copy of Nami and CI needs no PAT — the
# built-in GITHUB_TOKEN reaches its own repo. See .github/workflows/release.yml.
#
# Downloads used to live in a separate mrdainami/nami-releases because the
# source was closed. Nothing had shipped when it opened, so they moved here
# rather than leaving the star count on a repo with no code in it.
publish:
  provider: github
  owner: mrdainami
  repo: nami
  # Drafts, deliberately. A build lands where it can be looked at and the notes
  # written before anyone can download it, and pressing Publish stays a human
  # decision — the moment it goes live is the moment every installed Nami starts
  # offering it. Set releaseType: release here if that ever becomes tedious.
  releaseType: draft

files:
  - src/**/*
  - package.json
  - '!**/*.map'

  # --- weight, in descending order of how much it saves -------------------
  # 170 MB: the ORT tarball carries every platform, and a build can only ever
  # load its own. ${platform} is the machine doing the build (darwin, win32),
  # which is the platform being built: each one is built on its own OS, because
  # npm only installs the node-pty and sharp binaries for the machine it runs on.
  - '!node_modules/onnxruntime-node/bin/napi-v3/!(${platform})/**'
  # 34 MB: and of that platform's slices, keep only the arch being built.
  - '!node_modules/onnxruntime-node/bin/napi-v3/${platform}/!(${arch})/**'
  #
  # These two lines stay HERE, not under `mac.files` / `win.files`, where they
  # read better and where the Windows branch first put them. electron-builder
  # folds this top-level list into one file set, and a platform's own `files`
  # into another that it treats as the main one. A main set holding nothing but
  # exclusions gets `**/*` put in front of it — so the app shipped the whole
  # repo: docs, tests, scripts, and whatever scratch file was lying in the root.
  # Found by check-bundle on the first Windows build; the same was true of the
  # Mac for as long as `mac.files` existed.

  # 68 MB: transformers declares onnxruntime-web as a hard dependency, but the
  # build we actually load (dist/transformers.node.mjs) imports only node:*,
  # onnxruntime-common, onnxruntime-node and sharp. Nothing reaches for -web.
  - '!node_modules/onnxruntime-web/**'

  # 28 MB: of that dist we need exactly one file. The rest is the browser build,
  # its 21.6 MB ORT wasm, and source maps — none of it reachable from main.
  - '!node_modules/@huggingface/transformers/dist/!(transformers.node.mjs)'

# whisper-tiny.en, so a fresh install transcribes with no network and no
# account. main.js copies this into userData on first launch: the app bundle is
# read-only, and a later model upgrade has to land somewhere writable.
# Populated by `npm run fetch-model` (wired to prepack).
extraResources:
  - from: build/models
    to: models
    filter: ['**/*']

# Native binaries cannot be dlopen'd from inside an asar archive.
asarUnpack:
  - '**/node_modules/onnxruntime-node/bin/**'
  - '**/node_modules/@lydell/node-pty/**'
  # node-pty and sharp keep their Windows binaries in per-arch sibling packages,
  # and conpty ships an .exe and .dll beside its .node that the glob below misses.
  - '**/node_modules/@lydell/node-pty-win32-*/**'
  - '**/node_modules/@img/sharp-win32-*/**'
  - '**/*.node'

# The dmg is what the user downloads, so it is what carries the quarantine flag
# and what Gatekeeper judges first. electron-builder signs the app and leaves the
# container unsigned, which reads as "unidentified developer" before anyone has
# seen the app. Sign it here; notarize it in the hook below.
dmg:
  sign: true
afterAllArtifactBuild: scripts/notarize-dmg.mjs

# Windows ARM64 only; on a Mac, and for x64, it does nothing. Without it the
# ARM64 installer succeeds and installs an app with no Nami.exe in it. The
# script says why.
beforePack: scripts/win-pack.mjs

# No version in the installer's name, on purpose. The download button on
# nami.dainami.ai points at
#   github.com/mrdainami/nami/releases/latest/download/Nami-arm64.dmg
# and that path can only resolve if the newest release holds an asset with
# exactly that name. Put the version back in and the site's link dies at the
# next release — silently, because GitHub answers a missing asset with its own
# 404 page rather than anything the site could notice.
# The version is still in the release title, the tag, and the app's About.
artifactName: ${productName}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    # What a person downloads. Carries the quarantine flag, gets judged by
    # Gatekeeper, and is what the website links to.
    - target: dmg
      arch: [arm64, x64]
    # What the updater installs, and the only thing it can install: on macOS
    # electron-updater hands the swap to Squirrel.Mac, which unpacks a zip of
    # the .app. A release with only dmgs on it has nothing an update can use.
    # Nobody clicks this file; it exists for latest-mac.yml to point at.
    - target: zip
      arch: [arm64, x64]
  # What Nami offers to open. Declaring a type only puts Nami in Finder's
  # "Open With" — it never takes a default; the person still picks one.
  #
  # The list is short on purpose. These are documents Nami renders as a tile
  # today and that a workbench plausibly owns. Images, video, audio and PDF
  # belong to Preview, and .json / .yml belong to an editor: appearing in
  # everything's Open With menu is noise, not a feature. Keep this in step with
  # OPEN_EXT in src/main/open-with.js, which decides where the file lands.
  #
  # rank Alternate, not electron-builder's default of Default: a workbench does
  # not own markdown. Alternate keeps Nami in the Open With list without ever
  # winning the type on its own, so installing Nami never silently changes what
  # a double-click does. Setting it as the default stays a deliberate act —
  # Get Info → Open With → Change All.
  fileAssociations:
    - ext: [md, markdown, mdx]
      name: Markdown document
      role: Editor
      rank: Alternate
    - ext: [txt, text]
      name: Plain text document
      role: Editor
      rank: Alternate
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Nami uses your microphone so you can dictate into a session instead of
      typing.

win:
  icon: build/icon.ico
  # Microsoft's C++ runtime, which onnxruntime.dll needs and a clean Windows does
  # not have. Without it the first dictation on a new PC fails with "The
  # specified module could not be found". Microsoft permits shipping these files
  # app-local, beside the binary that needs them, in place of running vc_redist.
  # scripts/stage-vc-runtime.mjs fills the folder (predist:win runs it) and
  # explains where the files come from and why they are never downloaded.
  #
  # Beside onnxruntime.dll, not beside Nami.exe, and the difference is not
  # taste. Node loads a .node with LOAD_WITH_ALTERED_SEARCH_PATH, which makes
  # Windows look for that module's dependencies in the module's own folder
  # INSTEAD of the folder of the exe. Proved on a Windows 11 ARM64 VM with
  # the installed app: from this folder the process loads these copies; moved
  # beside Nami.exe they are never opened and System32's are loaded instead —
  # which on a clean PC means nothing is. No other native module in the app
  # imports the C++ runtime, and check-bundle fails the build if one starts to.
  #
  # The folder does not exist inside the asar, and does not need to: Windows
  # resolves DLLs on the real disk, and that is where app.asar.unpacked is.
  extraFiles:
    - from: build/vc-runtime/${arch}
      to: resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v3/win32/${arch}
      filter: ['*.dll']
  # No `fileAssociations` here, on purpose, though the Mac has them above.
  # electron-builder's NSIS template registers a type by writing the extension's
  # own default value (HKCU\Software\Classes\.md = its ProgID). That is taking
  # the default: on a PC where nobody has chosen an app for .md, a double-click
  # now opens Nami. Its uninstaller then deletes the ProgID and leaves the
  # extension pointing at it. There is no option that turns this off, in either
  # install mode (`perMachine` only moves the same keys from HKCU to HKLM).
  #
  # build/installer.nsh does the Windows half of the Mac rule instead: it lists
  # Nami under "Open with" for the same extensions (OpenWithProgids, and
  # Applications\Nami.exe\SupportedTypes) and never touches the default value,
  # so installing Nami never changes what a double-click does. The portable
  # build registers nothing, as a portable app should.
  # No `arch:` on these, unlike the Mac targets, and that is the fix for a real
  # bug. An arch list written here beats the one on the command line, so
  # `dist:win -- --arm64` built x64 as well — on an ARM machine, with the arm64
  # node-pty inside it, a terminal that can never start — plus a third 300 MB
  # installer holding both. Left off, the flag decides, and one run builds the
  # one arch its machine has the native modules for.
  target:
    # What a person downloads and what an update installs.
    - target: nsis
    # Runs from wherever it is dropped, for a machine that refuses installers.
    # It cannot update itself, so it is never what the website links to.
    - target: portable

# The top-level artifactName would give both Windows targets the same file name
# and the second would overwrite the first. Still no version, for the same
# reason as above: the site's download link has to survive a release.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nami
  artifactName: ${productName}-Setup-${arch}.${ext}
  # "Open with" for markdown and text, without taking the default. See the note
  # under `win:` for why this is a script and not a fileAssociations list.
  # electron-builder would find a file of this name by itself; it is named here
  # so that nobody has to know that to find it.
  include: build/installer.nsh

portable:
  artifactName: ${productName}-Portable-${arch}.${ext}
