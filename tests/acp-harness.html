<!doctype html>
<meta charset="utf-8">
<title>acp harness</title>
<link rel="stylesheet" href="../src/renderer/paper.css">
<style>
  body { padding: 20px; display: block; overflow: auto; }
  .fixture { border: 1px solid var(--line); margin-bottom: 24px; }
  .fixture > h2 { font: 700 13px/1.4 'Courier Prime', monospace; padding: 6px 12px; border-bottom: 1px solid var(--line); margin: 0; }
  .fixture .cw-scroll { max-height: 480px; }
  #results { font: 13px/1.7 'Courier Prime', monospace; white-space: pre-wrap; border: 2px solid var(--ink); padding: 12px 16px; margin-bottom: 24px; }
</style>
<div id="results">running…</div>
<div id="stage"></div>
<script src="harness-data.js"></script>
<script type="module">
import { normalizeUpdate } from '../src/renderer/acp-client.mjs';
import { createTranscript } from '../src/renderer/acp-render.mjs';

const out = [];
const ok = (name, cond) => out.push((cond ? 'PASS' : 'FAIL') + ' · ' + name);
const stage = document.getElementById('stage');

const calls = { link: 0, copy: 0, open: 0, commands: 0, usage: 0, info: 0 };
let totalUnknown = 0;

for (const [name, tape] of Object.entries(window.FIXTURES)) {
  const box = document.createElement('div');
  box.className = 'fixture';
  box.innerHTML = '<h2>' + name + '</h2><div class="scrollhost"></div>';
  stage.appendChild(box);
  const t = createTranscript(box.querySelector('.scrollhost'), {
    noScroll: true,
    onLink: () => calls.link++,
    onCopy: () => calls.copy++,
    onOpenFile: () => calls.open++,
    onCommands: () => calls.commands++,
    onUsage: () => calls.usage++,
    onInfo: () => calls.info++,
  });
  box._t = t;
  for (const e of tape) {
    const m = e.msg;
    if (e.dir === 'recv' && m.method === 'session/update') {
      t.apply(normalizeUpdate((m.params && (m.params.update || m.params)) || {}));
    } else if (e.dir === 'recv' && m.method === 'session/request_permission') {
      t.permission(m.params, () => {});
    } else if (e.dir === 'send' && m.method === 'session/prompt') {
      t.userTurn(m.params.prompt.map((b) => b.text || '').join(''));
    }
  }
  t.turnEnd();
  totalUnknown += t.stats().unknownCount;
}

// ---- assertions -------------------------------------------------------------
ok('no unknown events across all fixtures', totalUnknown === 0);
ok('messages rendered', document.querySelectorAll('.cw-a').length >= 5);
ok('tool cards rendered', document.querySelectorAll('.cw-card:not(.cw-plan)').length >= 4);
ok('diff rendered with add lines', document.querySelectorAll('.cw-diff .a').length >= 3);
ok('plan card rendered', document.querySelectorAll('.cw-plan').length >= 1);
ok('permission card rendered with 3 options', (() => {
  const p = document.querySelector('.cw-perm');
  return p && p.querySelectorAll('.cw-btn').length >= 3;
})());
ok('usage callback fired', calls.usage > 0);
ok('info (session title) callback fired', calls.info > 0);
ok('commands callback fired', calls.commands > 0);

// thought fold: starts hidden, click opens
const think = document.querySelector('.cw-think');
const thinkBody = document.querySelector('.cw-think-body');
ok('thought folded by default', think && thinkBody && thinkBody.hidden);
if (think) think.click();
ok('thought opens on click', thinkBody && !thinkBody.hidden);
ok('thought label settled to plain word', think && /^Thought/.test(think.textContent.trim()));

// tool card collapse on header click
const hd = document.querySelector('.cw-card:not(.cw-plan) .cw-card-hd');
const tb = hd && hd.parentElement.querySelector('.cw-tool-body');
if (hd) hd.click();
ok('tool card collapses on header click', tb && tb.hidden);
if (hd) hd.click();
ok('tool card reopens', tb && !tb.hidden);

// permission click answers and settles
const permBtn = document.querySelector('.cw-perm .cw-btn.ap');
if (permBtn) permBtn.click();
ok('permission click settles the card', document.querySelectorAll('.cw-settle').length >= 1);

// links + copy affordances
const link = document.querySelector('.cw-a a[data-link]');
if (link) link.click();
ok('link click routes to handler', calls.link >= 1);
const copyBtn = document.querySelector('[data-copy]');
if (copyBtn) copyBtn.click();
ok('code copy button routes to handler', calls.copy >= 1);
ok('code block rendered from fences', document.querySelectorAll('.cw-code').length >= 1);

// selection allowed on transcript text
const a = document.querySelector('.cw-a');
ok('transcript text selectable', a && getComputedStyle(a).userSelect !== 'none');

// humanizer: banned strings must not appear in copy WE author (chrome labels,
// statuses, hints) — the agent's own words are its own business.
const authored = [...stage.querySelectorAll('.cw-run, .cw-perm .q, .cw-think .tw, .cw-card-hd .k, .cw-copy, .cw-hint')]
  .map((el) => el.textContent).join(' | ');
const banned = ['session/', 'advertised', 'ACP', 'sessionUpdate', 'agent_message', 'protocol', 'cowork'];
const hits = banned.filter((b) => authored.includes(b));
ok('no protocol vocabulary in authored copy' + (hits.length ? ' [' + hits.join(',') + ']' : ''), hits.length === 0);

const fails = out.filter((l) => l.startsWith('FAIL')).length;
document.getElementById('results').textContent =
  (fails ? 'RESULT: FAIL (' + fails + ')' : 'RESULT: ALL PASS (' + out.length + ')') + '\n' + out.join('\n');
document.title = fails ? 'HARNESS-FAIL' : 'HARNESS-PASS';
</script>
