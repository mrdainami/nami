# Nami on Windows — tested and built, never released.
#
# This is the proof that the Windows column still works, run on real Windows on
# every push that could break it. It produces installers a person can download
# from the run page and try. It does NOT publish anything: shipping is
# release.yml's job, and a Windows release joins it only once these builds have
# been lived in.
#
# The installers are unsigned, so Windows will warn about an unknown publisher
# when one is opened. That is expected here and is not a build failure.

name: windows

on:
  push:
    branches: [master, windows]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One machine per arch, on purpose. npm only installs the node-pty and sharp
    # binaries that match the machine it runs on, so an arm64 installer built on
    # an x64 runner would ship with no terminal in it and no error to say so.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      # Without this, git rewrites every line ending on checkout and the tests
      # that read fixtures byte for byte fail for a reason that is not theirs.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same cache as release.yml, keyed per OS so the two never share a folder.
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/fetch-model.mjs', 'src/main/stt-model.js') }}

      - run: npm ci

      # The gate, the same one release.yml has. A red test never becomes a build.
      - run: npm test

      # The other half of release.yml's gate. It starts npm, which on Windows is
      # npm.cmd, and until the script learned that it failed here before it had
      # audited anything.
      - name: Reject known dependency vulnerabilities
        run: npm run check:security

      # onnxruntime.dll needs Microsoft's C++ runtime and a clean PC has none, so
      # the DLLs ship inside the app. They come off this runner's own Visual
      # Studio, never from a download. predist:win does this too; it is a step of
      # its own here so that the arch is the matrix's rather than Node's, and so
      # the log says which folder the files were taken from.
      - name: Collect the C++ runtime for this arch
        run: node scripts/stage-vc-runtime.mjs ${{ matrix.arch }}

      # Those DLLs come off this machine and go to every user, inside an
      # installer that carries Nami's name. Being in the right folder with the
      # right name is not proof of where a file came from; Microsoft's signature
      # is. Windows checks it here, and one DLL that is unsigned, tampered with,
      # or signed by anybody else stops the build before anything is packed.
      - name: Check that Microsoft signed every one of them
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem -Path build/vc-runtime -Recurse -Filter *.dll)
          if ($dlls.Count -eq 0) { throw 'build/vc-runtime holds no DLLs, so there is nothing to ship and nothing was checked.' }
          $bad = 0
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature -LiteralPath $dll.FullName
            $who = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(no signer)' }
            if ($sig.Status -eq 'Valid' -and $who -like '*O=Microsoft Corporation*') { Write-Host "ok   $($dll.FullName)" }
            else { Write-Host "BAD  $($dll.FullName): $($sig.Status), $who"; $bad++ }
          }
          if ($bad) { throw "$bad of $($dlls.Count) runtime DLLs are not validly signed by Microsoft." }

      # Signed by Microsoft's Artifact Signing service, in Dainami's name, when the
      # six AZURE_* secrets are there to sign with. A pull request from a fork gets
      # no secrets, and neither does anybody's own fork of this repo: there the
      # same step builds unsigned installers, which is all a stranger's code should
      # ever be able to make. Nothing about the signing is in electron-builder.yml
      # for that reason — a config that always asks for a signature fails every
      # build that cannot give one.
      #
      # The three AZURE_TENANT_ID / CLIENT_ID / CLIENT_SECRET values are read out
      # of the environment by the signing module itself and appear nowhere on a
      # command line. publisherName is the certificate's subject, letter for
      # letter; the updater compares against it, so it is written out here rather
      # than guessed from the secrets.
      - name: Build the installer and the portable app
        shell: pwsh
        env:
          # No .pfx certificate, ever: say so, or electron-builder goes looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          SIGN_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          if ($env:AZURE_CLIENT_SECRET -and $env:SIGN_ENDPOINT -and $env:SIGN_ACCOUNT -and $env:SIGN_PROFILE) {
            Write-Host 'signing: yes (Artifact Signing)'
            npm run dist:win -- --${{ matrix.arch }} `
              "-c.win.azureSignOptions.publisherName=DAINAMI PTE. LTD." `
              "-c.win.azureSignOptions.endpoint=$env:SIGN_ENDPOINT" `
              "-c.win.azureSignOptions.codeSigningAccountName=$env:SIGN_ACCOUNT" `
              "-c.win.azureSignOptions.certificateProfileName=$env:SIGN_PROFILE"
          } else {
            Write-Host 'signing: no (no signing secrets in this run) — the installers will be unsigned'
            npm run dist:win -- --${{ matrix.arch }}
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A signature that was asked for and did not happen must not pass quietly:
      # electron-builder logs a failed signing call and can still finish. Windows
      # is asked what it thinks of each installer, the same question a user's PC
      # will ask. When this run had no secrets, there is nothing to insist on.
      - name: Check who Windows says signed the installers
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          $bad = 0
          foreach ($exe in Get-ChildItem release/*.exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            $who = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(nobody)' }
            Write-Host ("{0,-28} {1,-10} {2}" -f $exe.Name, $sig.Status, $who)
            if ($env:EXPECT_SIGNED -eq 'true' -and ($sig.Status -ne 'Valid' -or $who -notmatch 'DAINAMI')) { $bad++ }
          }
          if ($bad) { throw "$bad installer(s) were meant to be signed by Dainami and are not." }

      # Opens what was actually built. A Windows app that is missing a native
      # module, or a DLL one of them needs, still installs and still opens; it
      # just has no voice or no terminal on a PC that is not this one.
      - name: Check what is inside the app
        run: node scripts/check-bundle.mjs

      - name: Keep what was built
        uses: actions/upload-artifact@v4
        with:
          name: Nami-windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
